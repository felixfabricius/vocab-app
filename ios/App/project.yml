# xcodegen spec: the source of truth for App.xcodeproj since PLAN-NATIVE M6.
# CI runs `xcodegen generate` here after `cap copy ios` (which creates App/public and the
# generated config files) and before `cap update ios` (which reads the deployment target
# from the generated pbxproj). The generated project is not committed.
name: App
options:
  bundleIdPrefix: in.fabricius
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_NO_COMMON_BLOCKS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES

packages:
  CapApp-SPM:
    path: CapApp-SPM

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "public/**"
          - "capacitor.config.json"
          - "config.xml"
      # The web build: a folder reference so every file ships as-is.
      - path: App/public
        type: folder
        buildPhase: resources
      - path: App/capacitor.config.json
        buildPhase: resources
      - path: App/config.xml
        buildPhase: resources
    dependencies:
      - package: CapApp-SPM
      - target: ALaLunaWidgets
        embed: true
    configFiles:
      Debug: ../debug.xcconfig
    settings:
      base:
        PRODUCT_NAME: ALaLuna
        PRODUCT_BUNDLE_IDENTIFIER: in.fabricius.vocab
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "$(inherited) -DDEBUG"

  ALaLunaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ../Widgets
    settings:
      base:
        PRODUCT_NAME: ALaLunaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: in.fabricius.vocab.widgets
        INFOPLIST_FILE: ../Widgets/Info.plist
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
