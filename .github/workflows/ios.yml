name: iOS

on:
  workflow_dispatch:
    inputs:
      force_match:
        description: Regenerate provisioning profiles (after changing capabilities)
        type: boolean
        default: false
      xcode:
        description: Xcode version on the runner
        type: string
        default: "26.6"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "ios/**"
      - "index.html"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "fastlane/**"
      - "Gemfile*"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm vite build

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode || '26.6' }}.app"

      # The Xcode project is generated from ios/App/project.yml. `cap copy` first (it creates
      # App/public and the generated config files the project references), then the project,
      # then `cap update` (it reads the deployment target from the pbxproj).
      - run: pnpm exec cap copy ios
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios/App && xcodegen generate --spec project.yml
      - run: pnpm exec cap update ios

      - name: Install fastlane
        run: bundle install

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
          FORCE_MATCH: ${{ inputs.force_match }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"

      - name: Show provisioning profile entitlements
        if: always()
        run: |
          for p in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision; do
            echo "== $p"
            security cms -D -i "$p" | plutil -extract Entitlements xml1 -o - - || true
            security cms -D -i "$p" | plutil -extract Name raw -o - - || true
          done

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ios-logs-${{ github.run_number }}
          path: |
            fastlane/logs
            build/*.ipa
          if-no-files-found: ignore
